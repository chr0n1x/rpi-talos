trivy-operator:
  image:
    registry: mirror.gcr.io
    repository: aquasec/trivy-operator

  trivy:
    image:
      registry: mirror.gcr.io
      repository: aquasec/trivy
      tag: "0.74.0"
    storageClassEnabled: true
    storageClassName: longhorn
    storageSize: "4Gi"
    # UNKNOWN+LOW were 81% of report rows (40k entries total).
    severity: "MEDIUM,HIGH,CRITICAL"

  operator:
    builtInTrivyServer: true
    infraAssessmentScannerEnabled: false
    # SBOM CRs are ~80 MB of etcd (~90% of the DB)
    sbomGenerationEnabled: false

vault-auth:
  vaultConnectionName: vault-secrets-operator/default
  authMethods:
    - name: trivy-reporter
      vaultAuthName: trivy-reporter-vault-auth
      method: kubernetes
      mount: in-cluster
      config:
        role: trivy
        serviceAccount: trivy-trivy-operator
        audiences:
          - vault

traefik-ingress:
  dnsNames:
    - dns: sbom.rannet.duckdns.org
      services:
        - kind: Service
          name: sbom-dashboard
          port: http
