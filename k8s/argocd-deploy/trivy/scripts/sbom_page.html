<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster SBOMs</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
:root { color-scheme: light dark; }
html, body { height: 100%; }
/* The page never scrolls itself; each pane scrolls within the viewport */
body { margin: 0; overflow: hidden; display: flex; flex-direction: column;
       font: 14px/1.5 system-ui, sans-serif; color: CanvasText; background: Canvas; }
header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
         padding: 10px 16px; border-bottom: 1px solid color-mix(in srgb, CanvasText 20%, transparent); }
h1 { font-size: 16px; margin: 0 12px 0 0; display: flex; align-items: center; gap: 8px; }
h1 svg { width: 18px; height: 18px; }
input, select { font: inherit; padding: 4px 6px; background: Field; color: FieldText;
                border: 1px solid color-mix(in srgb, CanvasText 30%, transparent); border-radius: 4px; }
#q { flex: 1 1 auto; min-width: 0; padding-right: 22px; }
/* own x button instead of the native one, so both browsers look the same */
#q::-webkit-search-cancel-button { -webkit-appearance: none; }
.qpick { flex: 1 1 220px; min-width: 180px; }
/* Same box as the inputs: 1.5em content + their 8px padding + 2px border */
#rl { display: inline-grid; place-items: center; box-sizing: border-box;
      min-height: calc(1.5em + 10px); padding: 4px 8px; font: inherit;
      background: Field; color: color-mix(in srgb, CanvasText 60%, transparent);
      border: 1px solid color-mix(in srgb, CanvasText 30%, transparent);
      border-radius: 4px; cursor: pointer; }
#rl:hover { color: CanvasText; }
#rl > svg { grid-area: 1 / 1; transition: opacity 250ms ease; }
#rl > svg.done { opacity: 0; color: #2f9e44; }
#rl.ok > svg.done { opacity: 1; }
#rl.ok > svg.glyph { opacity: 0; }
#rl.spin svg { animation: rlspin 700ms linear infinite; }
@keyframes rlspin { to { transform: rotate(360deg); } }
#ns { width: 150px; padding-right: 22px; }
.nspick { position: relative; display: inline-flex; align-items: center; }
button.nsx { position: absolute; right: 6px; display: inline-flex; padding: 0;
             border: 0; background: transparent; color: inherit; cursor: pointer;
             opacity: .5; }
button.nsx:hover { opacity: 1; }
.nsmenu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
          min-width: 100%; max-height: 280px; overflow-y: auto; padding: 4px 0;
          background: Canvas; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
          border-radius: 6px; box-shadow: 0 6px 16px rgb(0 0 0 / 25%); }
.nsmenu div { padding: 2px 12px; cursor: pointer; white-space: nowrap; }
.nsmenu div:hover { background: color-mix(in srgb, CanvasText 10%, transparent); }
.nsmenu div.sel { font-weight: 600; }
#meta { color: color-mix(in srgb, CanvasText 65%, transparent); }
main { flex: 1 1 auto; min-height: 0; padding: 8px 16px 20px; display: grid;
       grid-template-columns: var(--w1, 700px) 16px minmax(0, 1fr) 16px var(--w3, 280px);
       grid-template-rows: minmax(0, 1fr); gap: 0; }
/* Drag handles between the panes: the column itself is the gutter, the
   line is decorative and brightens on hover and while dragging */
.split { cursor: col-resize; position: relative; }
.split::after { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px;
                background: color-mix(in srgb, CanvasText 12%, transparent); }
.split:hover::after, .split.on::after { background: color-mix(in srgb, CanvasText 45%, transparent); }
@media (max-width: 900px) {
  body { overflow: auto; }
  main { grid-template-columns: 1fr; grid-template-rows: none; gap: 16px; }
  .split { display: none; }
  #list, #sbom, #users { overflow: visible; }
}
#list, #sbom, #users { overflow-y: auto; min-width: 0; }
.ns { color: color-mix(in srgb, CanvasText 60%, transparent); }
.kind { font-weight: 600; }
.cnt { margin-left: auto; color: color-mix(in srgb, CanvasText 55%, transparent); }
.cont { padding: 5px 6px; cursor: pointer; display: flex; gap: 10px; flex-wrap: wrap; border-radius: 4px; }
.cont:hover { background: color-mix(in srgb, CanvasText 8%, transparent); }
.cont.sel { background: color-mix(in srgb, CanvasText 14%, transparent); }
a.cont { color: inherit; text-decoration: none; }
a.cont:hover .name { text-decoration: underline; }
a.cont .go { margin-left: auto; align-self: center; display: inline-flex; color: color-mix(in srgb, CanvasText 45%, transparent); }
a.cont:hover .go { color: inherit; }
button.cp { margin-left: 8px; padding: 2px 6px; border-radius: 4px; vertical-align: middle; display: inline-flex;
            border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
            background: transparent; color: inherit; cursor: pointer;
            transition: color 150ms ease, opacity 150ms ease; }
button.cp.fade { opacity: 0; }
button.cp.ok { color: #2f9e44; }
.ref { font-family: ui-monospace, monospace; }
.reg { display: inline-flex; align-items: center; justify-content: center;
       min-width: 16px; min-height: 20px; align-self: center; padding: 0 2px;
       font-size: 11px; font-weight: 600;
       color: color-mix(in srgb, CanvasText 70%, transparent);
       border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 3px; }
.reg img { display: block; width: 15px; height: 15px; }
.vwarn { margin-left: 6px; align-self: center; font-size: 11px; font-weight: 700; }
a.vwarn { text-decoration: none; }
.vwarn.crit { color: #e5484d; }
.vwarn.high { color: #ff9f2f; }
.vwarn svg { display: inline-block; vertical-align: -2px; }
/* Body-level hover label: in-pane tooltips get clipped by the pane's scroll
   overflow, and native title tooltips have a slow show delay */
#tip { position: fixed; left: 0; top: 0; transform: translateY(-50%); z-index: 10;
       padding: 2px 8px; border-radius: 4px; white-space: nowrap; pointer-events: none;
       background: color-mix(in srgb, CanvasText 85%, transparent); color: Canvas;
       font: 12px/1.4 system-ui, sans-serif; opacity: 0; transition: opacity 120ms ease; }
#tip.on { opacity: 1; }
.dig { color: color-mix(in srgb, CanvasText 55%, transparent); font-family: ui-monospace, monospace; }
#sbom, #users { margin: 0; padding: 12px; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
                border-radius: 6px; }
#sbom h2, #users h2 { font-size: 14px; margin: 0 0 6px; word-break: break-all; }
table { border-collapse: collapse; width: 100%; margin-top: 8px; }
th, td { text-align: left; padding: 3px 8px 3px 0; vertical-align: top;
         border-bottom: 1px solid color-mix(in srgb, CanvasText 10%, transparent); }
td.v, td.t { font-family: ui-monospace, monospace; white-space: nowrap; }
.empty { color: color-mix(in srgb, CanvasText 60%, transparent); }
.kinds { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
.kinds .kind { font-size: 11px; padding: 0 6px; border-radius: 3px;
               border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
               color: color-mix(in srgb, CanvasText 70%, transparent);
               display: inline-flex; align-items: center; gap: 4px; }
.kic { display: inline-flex; align-items: center; gap: 4px; }
.kic svg { flex: none; opacity: .75; }
a.ext { margin-left: 8px; vertical-align: middle;
        color: color-mix(in srgb, CanvasText 45%, transparent); }
a.ext:hover { color: CanvasText; }
.cont a.ext { margin-left: 6px; }
</style>
</head>
<body>
<header>
  <h1><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#101826"/><path d="M12 4.6v3.6M9.9 6.4l2.1 2 2.1-2" fill="none" stroke="#f87171" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.4 9.6h11.2l-4.3 5.2v3.4l-2.6 1.5v-4.9z" fill="none" stroke="#22d3ee" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>Cluster SBOMs</h1>
  <div class="nspick">
    <input id="ns" type="text" autocomplete="off" spellcheck="false"
           placeholder="namespace" aria-label="namespace" aria-haspopup="listbox"
           role="combobox" aria-expanded="false" aria-controls="nsmenu">
    <button id="nsx" class="nsx" type="button" aria-label="clear namespace" hidden></button>
    <div id="nsmenu" class="nsmenu" role="listbox" hidden></div>
  </div>
  <div class="nspick qpick">
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="fuzzy search: package, image or where it is used">
    <button id="qx" class="nsx" type="button" aria-label="clear search" hidden></button>
  </div>
  <button id="rl" type="button" aria-label="refresh cache" data-tip="refresh cache"></button>
  <span id="meta"></span>
</header>
<main>
  <div id="list"></div>
  <div id="sp1" class="split" role="separator" aria-orientation="vertical"></div>
  <div id="sbom"><div class="empty">select a container to view its SBOM</div></div>
  <div id="sp2" class="split" role="separator" aria-orientation="vertical"></div>
  <div id="users"></div>
</main>
<div id="tip" aria-hidden="true"></div>
<script src="/page.js"></script>
</body>
</html>
