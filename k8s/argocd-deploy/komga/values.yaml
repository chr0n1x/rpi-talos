traefik-ingress:
  dnsNames:
    - dns: komga.rannet.duckdns.org
      services:
        - kind: Service
          name: komga
          port: http
    - dns: gutendexer.rannet.duckdns.org
      services:
        - kind: Service
          name: gutendexer
          port: http

vault-auth:
  vaultConnectionName: vault-secrets-operator/default
  authMethods:
    - name: on-prem
      vaultAuthName: komga-vso-connection-auth
      method: kubernetes
      mount: in-cluster
      config:
        role: komga
        serviceAccount: komga
        audiences:
          - vault

gutendexer:
  global:
    fullnameOverride: gutendexer
  controllers:
    main:
      type: deployment
      strategy: RollingUpdate
      rollingUpdate:
        unavailable: 1
      serviceAccount:
        name: komga
      pod:
        nodeSelector:
          kubernetes.io/arch: arm64
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          nameOverride: gutendexer
          image:
            repository: registry.rannet.duckdns.org/gutindexer/gutendexer
            tag: latest
            pullPolicy: Always
          env:
            TZ: America/New_York
            GUTENDEX_BASE_URL: http://gutendex:8000/books
          ports:
            - name: http
              containerPort: 8080
          probes:
            liveness:
              enabled: true
              type: HTTP
              path: /healthz
              port: http
              spec:
                initialDelaySeconds: 5
                periodSeconds: 30
            readiness:
              enabled: true
              type: HTTP
              path: /healthz
              port: http
              spec:
                initialDelaySeconds: 3
                periodSeconds: 10
  persistence:
    cfg:
      type: configMap
      name: gutendexer-config
      items:
        - key: gutenberg.json
          path: gutenberg.json
      advancedMounts:
        main:
          main:
            - path: /cfg
              readOnly: true
    data:
      type: persistentVolumeClaim
      existingClaim: komga-data
      advancedMounts:
        main:
          main:
            - path: /data
    state:
      type: persistentVolumeClaim
      forceRename: gutendexer-state
      accessMode: ReadWriteOnce
      storageClass: smb
      size: 5Mi
      retain: true
      advancedMounts:
        main:
          main:
            - path: /state
  service:
    gutendexer:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 8080
  # Initial seed only. On first boot this is copied to /state/gutenberg.json
  # (state PVC). UI edits write to the PVC and survive ArgoCD syncs.
  # This block is inert once the state PVC exists.
  config:
    topics: ["gothic"]
    max_per_run: 10
    sleep_between: 1800
    languages: en
    output_dir: /data/Gutenberg
    schedule_hour: 2
    scheduler_enabled: false
    user_agent: "rpi-talos-gutendexer/1.0 (self-hosted; contact chr0n1x)"

gutendex:
  global:
    fullnameOverride: gutendex
  controllers:
    main:
      type: deployment
      strategy: RollingUpdate
      rollingUpdate:
        unavailable: 1
      serviceAccount:
        name: komga
      pod:
        nodeSelector:
          kubernetes.io/arch: arm64
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          nameOverride: gutendex
          image:
            repository: registry.rannet.duckdns.org/gutindexer/gutendex
            tag: latest
            pullPolicy: Always
          env:
            TZ: America/New_York
            SECRET_KEY:
              valueFrom:
                secretKeyRef:
                  name: gutendex-secrets
                  key: SECRET_KEY
            DATABASE_ENGINE: django.db.backends.sqlite3
            DATABASE_NAME: /data/gutendex.sqlite3
            ALLOWED_HOSTS: gutendex,localhost,127.0.0.1
            STATIC_ROOT: /app/gutendex-src/staticfiles
            MEDIA_ROOT: /app/gutendex-src/media
            EMAIL_HOST: localhost
            EMAIL_HOST_ADDRESS: localhost:25
            EMAIL_HOST_PASSWORD: ""
            EMAIL_HOST_USER: ""
            DEBUG: "0"
            HOME: /tmp
          ports:
            - name: http
              containerPort: 8000
          probes:
            liveness:
              enabled: true
              type: HTTP
              path: /
              port: http
              spec:
                initialDelaySeconds: 15
                periodSeconds: 30
            readiness:
              enabled: true
              type: HTTP
              path: /
              port: http
              spec:
                initialDelaySeconds: 15
                periodSeconds: 10
  persistence:
    data:
      type: persistentVolumeClaim
      forceRename: gutendex-data
      accessMode: ReadWriteOnce
      storageClass: smb
      size: 200Mi
      retain: true
      advancedMounts:
        main:
          main:
            - path: /data
  service:
    gutendex:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 8000


komga:
  controllers:
    main:

      type: deployment
      strategy: RollingUpdate
      rollingUpdate:
        unavailable: 1
      containers:
        main:
          image:
            pullPolicy: Always
            repository: ghcr.io/gotson/komga
            tag: 1.28.1

          env:
            KOMGA_DATABASE_CHECKLOCALFILESYSTEM: "FALSE"
            KOMGA_TASKSDB_CHECKLOCALFILESYSTEM: "FALSE"
            KOMGA_OAUTH2ACCOUNTCREATION: true
            KOMGA_OIDCEMAILVERIFICATION: false
            SPRING_CONFIG_ADDITIONAL_LOCATION: /app/config/application.yml
            TZ: America/New_York

  persistence:

    oidc:
      type: secret
      name: komga-properties
      advancedMounts:
        main:   # main controller
          main: # main container
            - path: /app/config

    data:
      type: persistentVolumeClaim
      accessMode: ReadWriteMany
      storageClass: smb
      size: 8Gi
      retain: true
      advancedMounts:
        main:   # main controller
          main: # main container
            - path: /data

    config:
      type: persistentVolumeClaim
      accessMode: ReadWriteMany
      storageClass: smb
      size: 8Gi
      retain: true
      advancedMounts:
        main:   # main controller
          main: # main container
            - path: /config

  service:
    komga:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 25600
