---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: komga-oidc-secrets-vaultsecret-ref
  namespace: {{ .Release.Namespace }}
spec:
  type: kv-v2
  mount: in-cluster
  path: komga/properties
  destination:
    name: komga-env
    create: true
  refreshAfter: 30s
  vaultAuthRef: {{ .Release.Namespace -}}/komga-vso-connection-auth
