apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gutendex-secret-key
  namespace: {{ .Release.Namespace }}
spec:
  type: kv-v2
  mount: in-cluster
  path: komga/gutendex/deploy
  destination:
    name: gutendex-secrets
    create: true
    type: Opaque
    keys:
      - SECRET_KEY
  refreshAfter: 30s
  vaultAuthRef: {{ .Release.Namespace }}/komga-vso-connection-auth
