apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: dhi-io-image-pull
  namespace: {{ .Release.Namespace }}
spec:
  type: kv-v2
  mount: in-cluster
  path: cert-manager/docker
  destination:
    name: dhi-io-image-pull
    create: true
    type: kubernetes.io/dockerconfigjson
  refreshAfter: 30s
  vaultAuthRef: {{ .Release.Namespace }}/cert-manager-vso-connection-auth
