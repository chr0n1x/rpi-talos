---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kreaps
  namespace: {{ .Values.argocd.namespace }}
spec:
  project: default
  source:
    repoURL: {{ .Values.repo.url }}
    path: k8s/argocd-deploy/kreaps
    targetRevision: HEAD
    helm:
      valueFiles:
        - ../values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: kreaps

  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
